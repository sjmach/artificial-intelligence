apiVersion: v1
kind: Pod
metadata:
  name: cuda-test
spec:
  restartPolicy: Never
  containers:
    - name: cuda
      image: nvidia/cuda:12.2.0-base-ubuntu22.04
      resources:
        limits:
          nvidia.com/gpu: 1
      command:
        - bash
        - -c
        - |
          echo "=== NVIDIA-SMI OUTPUT ==="
          nvidia-smi
          echo "========================="
          sleep 3600
